[project]
name = "spark-async"
version = "0.1.0"
description = "Async per-row mapping for PySpark partitions"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Michal Klempa" }]
requires-python = ">=3.13"
dependencies = [
    "pyspark>=4.2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["spark_async"]
